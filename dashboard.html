<!DOCTYPE html>
<html>
<body style="background:#060a12; color:#00ff87; font-family:monospace; padding:20px;">
    <h3>ECSU 2.0 | ПРОТОКОЛ "КОВЧЕГ" | ВЛАДЕЛЕЦ: НИКОЛАЕВ В.В.</h3>
    <div id="console" style="border:1px solid #00ff87; height:400px; overflow-y:auto; padding:10px; background:#0d1b2e;"></div>
    <input type="text" id="in" style="width:100%; background:#000; color:#00ff87; border:1px solid #00ff87; padding:10px; margin-top:10px;" placeholder="Введите: migrate или checklist">
    <script>
        const con = document.getElementById('console');
        const socket = new WebSocket('ws://127.0.0.1:8001/ws');
        const log = (t) => { con.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${t}</div>`; con.scrollTop = con.scrollHeight; };
        socket.onopen = () => log('🟢 СВЯЗЬ С ЯДРОМ 8001 УСТАНОВЛЕНА');
        socket.onmessage = (e) => log(e.data);
        socket.onclose = () => log('🔴 СВЯЗЬ ПОТЕРЯНА');
        document.getElementById('in').onkeypress = (e) => {
            if (e.key === 'Enter') { socket.send(e.target.value); log('> ' + e.target.value); e.target.value = ''; }
        };
    </script>
</body>
</html>
